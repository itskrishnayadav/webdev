<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Mart Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left-section">
            <img
                src="https://placehold.co/500x500/19bfd1/ffffff?text=Laundry+Mart"
                alt="Laundry Mart"
            >
        </div>

        <div class="form-section">

            <form class="login-form">

                <h1>Hello Again!</h1>

                <p class="description">
                    Welcome back, we've missed you!
                </p>

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>
</html>
